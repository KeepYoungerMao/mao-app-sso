spring:
  flyway:
    enabled: true
    baseline-on-migrate: true
    clean-disabled: false
    locations: classpath:db/migration
  thymeleaf:
    cache: false

server:
  servlet:
    session:
      timeout: 30m
      cookie:
        name: SSO_SESSION
        http-only: true
        same-site: Lax

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: NULL
    default-fetch-size: 100

sso:
  # 测试环境允许临时签名密钥（每次运行生成新密钥，Token 仅在当次运行内有效）
  jwk:
    allow-ephemeral: true
  issuer-url: http://localhost:8080

  # 动态客户端注册：测试环境开启。
  # 语义为「预录入 + 按 redirect_uri 查表」，请求参数不得超出预录入范围；
  # 因此不再有 scope / grant_type / redirect_uri 正则白名单等配置项。
  dcr:
    enabled: true
    max-registrations-per-minute: 30

  # 发现元数据：本服务只定义 openid / profile 两个 scope（仅用于 claims 裁剪）
  metadata:
    scopes-supported: "openid,profile"
    allow-public-clients: true
    cors-enabled: true
    cors-allowed-origins: "*"

  # 管理 API：测试环境开启，鉴权按角色（roles claim 含 ADMIN）
  admin-api:
    enabled: true
    client-id: mao-app-admin
    required-role: ADMIN
    cors-allowed-origins: "*"

logging:
  level:
    root: WARN
    com.mao.sso: INFO
    org.springframework.security: WARN
