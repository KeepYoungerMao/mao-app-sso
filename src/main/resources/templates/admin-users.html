<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head th:replace="~{fragments/layout :: head('用户管理 - mao-app-sso')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar('admin')}"></nav>

<main class="page-container">
  <section class="card" aria-labelledby="admin-title">
    <h1 id="admin-title">用户管理</h1>
    <p class="muted">仅管理员（ROLE_ADMIN）可访问本页面。</p>

    <div th:if="${successMessage}" class="alert alert-success" role="status" th:text="${successMessage}">操作成功</div>

    <div class="table-wrapper" role="region" aria-label="用户列表" tabindex="0">
      <table>
        <thead>
          <tr>
            <th scope="col">ID</th>
            <th scope="col">用户名</th>
            <th scope="col">邮箱</th>
            <th scope="col">角色</th>
            <th scope="col">状态</th>
            <th scope="col">操作</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="user : ${users}">
            <td th:text="${user.id}">1</td>
            <td th:text="${user.username}">admin</td>
            <td th:text="${user.email}">admin@mao.local</td>
            <td>
              <span class="badge" th:each="role : ${user.roles}" th:text="${role.code}">ROLE_USER</span>
            </td>
            <td>
              <span class="badge" th:classappend="${user.enabled} ? 'badge-success' : 'badge-danger'"
                    th:text="${user.enabled} ? '启用' : '禁用'">启用</span>
              <span class="badge" th:classappend="${user.accountLocked} ? 'badge-danger' : 'badge-success'"
                    th:text="${user.accountLocked} ? '锁定' : '正常'">正常</span>
            </td>
            <td>
              <span th:if="${user.id == currentUserId}" class="muted">当前用户</span>
              <form th:unless="${user.id == currentUserId}" th:action="@{/admin/users/status}" method="post"
                    class="inline-form">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input type="hidden" name="userId" th:value="${user.id}">
                <input type="hidden" name="enabled" th:value="${user.enabled} ? 'false' : 'true'">
                <input type="hidden" name="locked" th:value="${user.accountLocked} ? 'false' : 'false'">
                <button type="submit" class="button small secondary"
                        th:text="${user.enabled} ? '禁用' : '启用'">禁用</button>
              </form>
              <form th:unless="${user.id == currentUserId}" th:action="@{/admin/users/status}" method="post"
                    class="inline-form">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input type="hidden" name="userId" th:value="${user.id}">
                <input type="hidden" name="enabled" th:value="${user.enabled}">
                <input type="hidden" name="locked" th:value="${user.accountLocked} ? 'false' : 'true'">
                <button type="submit" class="button small secondary"
                        th:text="${user.accountLocked} ? '解锁' : '锁定'">锁定</button>
              </form>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
