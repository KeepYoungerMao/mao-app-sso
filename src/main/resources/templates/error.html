<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head th:replace="~{fragments/layout :: head('出错了 - mao-app-sso')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar('')}"></nav>

<main class="page-container narrow">
  <section class="card" aria-labelledby="error-title">
    <h1 id="error-title">出错了</h1>
    <div class="alert alert-error" role="alert">
      <p th:text="${errorMessage ?: '服务器处理请求时发生错误，请稍后重试。'}">错误信息</p>
    </div>
    <p class="muted">如果问题持续存在，请联系管理员并提供访问时间与操作路径。</p>
    <a class="button primary" th:href="@{/}">返回首页</a>
  </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
