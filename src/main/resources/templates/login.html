<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head th:replace="~{fragments/layout :: head('登录 - mao-app-sso')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar('login')}"></nav>

<main class="page-container narrow">
  <section class="card" aria-labelledby="login-title">
    <h1 id="login-title">登录</h1>
    <p class="muted">使用用户名或邮箱登录 mao-app-sso 认证中心</p>

    <div th:if="${errorMessage}" class="alert alert-error" role="alert" th:text="${errorMessage}">用户名或密码错误</div>
    <div th:if="${logoutMessage}" class="alert alert-success" role="status" th:text="${logoutMessage}">已退出登录</div>
    <p th:if="${pendingAuthorization}" class="muted">您正在授权第三方应用访问，请先登录。</p>

    <form th:action="@{/login}" method="post" novalidate>
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

      <div class="form-field">
        <label for="username">用户名或邮箱</label>
        <input type="text" id="username" name="username" required autofocus
               autocomplete="username" maxlength="255" placeholder="请输入用户名或邮箱">
      </div>

      <div class="form-field">
        <label for="password">密码</label>
        <input type="password" id="password" name="password" required
               autocomplete="current-password" maxlength="255" placeholder="请输入密码">
      </div>

      <button type="submit" class="button primary full-width">登 录</button>
    </form>
  </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
