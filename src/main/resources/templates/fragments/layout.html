<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head th:fragment="head(title)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">mao-app-sso 认证中心</title>
  <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>

<nav th:fragment="navbar(active)" aria-label="主导航">
  <div class="nav-container">
    <a class="nav-brand" th:href="@{/}" th:classappend="${active == 'home'} ? 'active' : ''">mao-app-sso</a>
    <div class="nav-links">
      <a th:href="@{/}" th:classappend="${active == 'home'} ? 'active' : ''"
         th:text="${active == 'home'} ? '首页' : '首页'">首页</a>
      <span sec:authorize="isAuthenticated()">
        <a th:href="@{/profile}" th:classappend="${active == 'profile'} ? 'active' : ''">个人资料</a>
        <a sec:authorize="hasRole('ROLE_ADMIN')" th:href="@{/admin/users}"
           th:classappend="${active == 'admin'} ? 'active' : ''">用户管理</a>
        <a sec:authorize="hasRole('ROLE_ADMIN')" th:href="@{/admin/clients}"
           th:classappend="${active == 'admin-clients'} ? 'active' : ''">客户端管理</a>
        <form class="nav-logout" th:action="@{/logout}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
          <button type="submit" class="link-button">退出登录</button>
        </form>
      </span>
      <a sec:authorize="isAnonymous()" th:href="@{/login}"
         th:classappend="${active == 'login'} ? 'active' : ''">登录</a>
    </div>
  </div>
</nav>

<footer th:fragment="footer">
  <div class="footer-container">
    <p>mao-app-sso · OAuth 2.1 / OpenID Connect 1.0 认证中心</p>
  </div>
</footer>

</body>
</html>
